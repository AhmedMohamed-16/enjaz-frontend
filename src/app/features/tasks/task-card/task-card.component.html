<article class="task-card">
    <div class="task-header">
        <div class="task-title">{{ task.title }}</div>
        <div class="badges">
            <button type="button" class="status-pill" [ngClass]="statusClass" (click)="toggleStatus()"
                aria-label="Change task status">
                {{ statusLabel }}
            </button>
            <span class="priority-pill" [ngClass]="priorityClass">{{ task.priority }}</span>
        </div>
    </div>

    <p class="task-description">{{ task.description || 'No description provided.' }}</p>

    <div class="task-meta">
        <span class="due-date" [class.overdue]="task.isOverdue">{{ dueText }}</span>
        <div class="task-actions">
            <button type="button" class="icon-btn" (click)="editTask()" aria-label="Edit task">✏️</button>
            <button type="button" class="icon-btn" (click)="deleteTask()" aria-label="Delete task">🗑️</button>
        </div>
    </div>
</article>
